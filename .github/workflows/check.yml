name: Verificar CotizaYa
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: cotizaya_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d cotizaya_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-public-key
      SUPABASE_DB_URL: postgres://postgres:local-ci-only@127.0.0.1:5432/cotizaya_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node supabase/tests/preparar-seguro.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/check.sh
