name: cotizaya-preview
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/preview/Dockerfile
    image: cotizaya-preview:20261102
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/demo/cotizaciones').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:80"
      - "100.113.167.30:3100:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/demo/cotizaciones]
      interval: 15s
      timeout: 5s
      retries: 3
